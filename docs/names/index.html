<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Name Stats</title>
<style>
    :root {
        --bg: #fafaf7;
        --fg: #111;
        --mut: #8a8a85;
        --ac: #e4572e;
        --ln: #ddddd6
    }

    @media(prefers-color-scheme:dark) {
        :root {
            --bg: #111;
            --fg: #eee;
            --mut: #777;
            --ac: #ff7a50;
            --ln: #2a2a2a
        }
    }

    * {
        box-sizing: border-box
    }

    body {
        margin: 0 auto;
        max-width: 1000px;
        padding: 7vh 6vw 10vh;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace
    }

    #q {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--ln);
        background: none;
        color: var(--fg);
        font: inherit;
        font-size: clamp(28px, 6vw, 56px);
        padding: 0 0 8px;
        outline: 0
    }

    #q:focus {
        border-color: var(--ac)
    }

    #top {
        display: flex;
        align-items: flex-end;
        gap: 18px;
        margin-bottom: 28px
    }

    #q {
        flex: 1;
        min-width: 0;
        width: auto
    }

    #glink {
        text-decoration: none;
        white-space: nowrap;
        flex: none
    }

    #glink.on {
        border-color: var(--ac);
        color: var(--ac)
    }

    #game {
        display: none
    }

    body.game #game {
        display: block
    }

    body.game #out,
    body.game #q {
        display: none
    }

    .sx a {
        margin-right: 14px;
        cursor: pointer;
        color: var(--mut)
    }

    .sx a:hover,
    .sx a.on {
        color: var(--ac)
    }

    .sx a.off,
    .sx a.off:hover {
        color: var(--mut);
        opacity: .35;
        cursor: default;
        pointer-events: none
    }

    .mut {
        color: var(--mut)
    }

    h1 {
        font-size: clamp(28px, 5vw, 48px);
        font-weight: 300;
        margin: 0
    }

    .hd {
        display: flex;
        align-items: baseline;
        gap: 18px;
        flex-wrap: wrap;
        margin-bottom: 6px
    }

    svg {
        display: block;
        width: 100%;
        overflow: visible
    }

    .row {
        margin: 36px 0 0
    }

    .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6vw
    }

    @media(max-width:640px) {
        .cols {
            grid-template-columns: 1fr
        }
    }

    .n {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        gap: 32px;
        padding: 8px 0;
        font-size: 20px;
        border-bottom: 1px solid var(--ln);
        cursor: pointer
    }

    .n span {
        width: 14ch;
        flex: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap
    }

    .n:hover {
        color: var(--ac)
    }

    h2 {
        font-size: 14px;
        font-weight: 400;
        color: var(--mut);
        margin: 0 0 10px;
        letter-spacing: .1em
    }

    #tip {
        height: 20px
    }

    .cols .n {
        gap: 14px
    }

    .n .rk {
        width: 2ch;
        color: var(--mut);
        font-size: 13px
    }

    .cat h1 {
        font-size: clamp(22px, 4vw, 34px)
    }

    .btn,
    #gs,
    #gy {
        font: inherit;
        color: var(--fg);
        background: none;
        border: 1px solid var(--ln);
        padding: 6px 12px;
        cursor: pointer
    }

    .btn:hover {
        border-color: var(--ac);
        color: var(--ac)
    }

    #gi {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--ln);
        background: none;
        color: var(--fg);
        font: inherit;
        font-size: 20px;
        padding: 6px 0;
        margin: 8px 0;
        outline: 0
    }

    #gi:focus {
        border-color: var(--ac)
    }

    .gg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4vw;
        margin-top: 8px
    }

    .g2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2vw
    }

    .n.g {
        cursor: default;
        gap: 6px;
        padding: 3px 0;
        font-size: 13px
    }

    .n.g:hover {
        color: inherit
    }

    .n.g span {
        width: auto;
        flex: 1;
        min-width: 0
    }

    .n.g .rk {
        width: 2ch;
        flex: none
    }

    a.nl {
        color: inherit;
        text-decoration: none
    }

    a.nl:hover {
        color: var(--ac);
        text-decoration: underline
    }

    .st {
        min-height: 20px;
        font-size: 13px;
        text-transform: capitalize;
        margin-bottom: 6px
    }
</style>
<div id="top"><input id="q" placeholder="Enter a Name" autocomplete="off" autofocus spellcheck="false"><a class="btn"
        id="glink" href="#~game">The Name Game</a></div>
<div id="out"></div>
<div id="game" class="cat"></div>
<script>
    const POS = "AK0,0 ME10,0 VT9,1 NH10,1 WA0,2 ID1,2 MT2,2 ND3,2 MN4,2 IL5,2 WI6,2 MI7,2 NY8,2 RI9,2 MA10,2 OR0,3 NV1,3 WY2,3 SD3,3 IA4,3 IN5,3 OH6,3 PA7,3 NJ8,3 CT9,3 CA0,4 UT1,4 CO2,4 NE3,4 MO4,4 KY5,4 WV6,4 VA7,4 MD8,4 DE9,4 AZ1,5 NM2,5 KS3,5 AR4,5 TN5,5 NC6,5 SC7,5 DC8,5 OK3,6 LA4,6 MS5,6 AL6,6 GA7,6 HI0,7 TX3,7 FL8,7"
        .split(" ").reduce((o, s) => (o[s.slice(0, 2)] = s.slice(2).split(",").map(Number), o), {});
    const $ = id => document.getElementById(id), q = $("q"), fmt = n => n.toLocaleString();
    let N, Y, Y0, K, S, NL, T, yt, names, low, male, cnt, st, codes, tot, base, find, topL, sty, so, es, ey, ec;
    const NONE = 0xFFFFFFFF;
    let pin = -1;  // clicked state (-1 = none)

    async function init() {
        let buf = await (await fetch("./names.bin.gz")).arrayBuffer();
        if (new Uint8Array(buf, 0, 2).join() === "31,139")  // gzip magic 1f 8b
            buf = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
        let nb;[, , N, Y, Y0, K, nb, S, NL, T] = new Uint32Array(buf, 0, 10);
        if (new Uint32Array(buf, 0, 2)[1] !== 7) throw "regenerate names.bin with create_binary.py";
        const p4 = n => n + (-n & 3); let o = 40;
        names = new TextDecoder().decode(new Uint8Array(buf, o, nb)).split("\n"); o += p4(nb);
        male = new Uint8Array(buf, o, N); o += p4(N);
        cnt = new Uint32Array(buf, o, N * Y); o += N * Y * 4;
        yt = new Uint32Array(buf, o, 2 * Y); o += 2 * Y * 4;  // all births per year: F row, then M row
        o += 2 * N * K * 4;  // similar-name tables (unused)
        st = new Uint32Array(buf, o, N * S); o += N * S * 4;
        codes = new TextDecoder().decode(new Uint8Array(buf, o, S * 2)).match(/../g); o += p4(S * 2);
        o += p4(NL);  // notable-names blob (empty)
        // top T names: [place][sex][year][rank]; place 0 = national, 1+s = state; year 0 = all time
        topL = new Uint32Array(buf, o, (S + 1) * 2 * (Y + 1) * T); o += topL.length * 4;
        sty = new Uint32Array(buf, o, S * 2 * Y); o += sty.length * 4;  // births per state / sex / year
        so = new Uint32Array(buf, o, N + 1); o += (N + 1) * 4;  // per-name offsets into the entries
        const E = so[N];
        es = new Uint8Array(buf, o, E); o += p4(E);   // entry state
        ey = new Uint8Array(buf, o, E); o += p4(E);   // entry year - Y0
        ec = new Uint16Array(buf, o, E);              // entry births
        low = names.map(n => n.toLowerCase());
        tot = new Float64Array(N); base = [new Float64Array(S), new Float64Array(S)]; find = new Map();
        for (let i = 0; i < N; i++) {
            let t = 0; for (let k = i * Y; k < (i + 1) * Y; k++)t += cnt[k]; tot[i] = t;
            const b = base[male[i]]; for (let s = 0; s < S; s++)b[s] += st[i * S + s];
            const e = find.get(low[i]) || [-1, -1]; e[male[i]] = i; find.set(low[i], e);
        }
        showGame();
        route();
    }

    // raw births per year
    const raw = i => cnt.subarray(i * Y, (i + 1) * Y);
    // share of same-sex births each year (what the graphs plot)
    const series = i => { const r = raw(i), o = male[i] * Y; return Float64Array.from(r, (v, k) => v / (yt[o + k] || 1)); };
    // rate label: "per 10k" normally, "per 100k" when the rate is below 1 per 10k
    const rate = p => {
        const f = v => v <= 0 ? "0" : v < .01 ? "<0.01" : v >= 10 ? v.toFixed(0) : v >= 1 ? v.toFixed(1) : v.toFixed(2);
        const v = p * 1e4;
        return v > 0 && v < 1 ? f(v * 10) + " per 100k" : f(v) + " per 10k";
    };
    // percentage label: at least 2 decimals; under 1%, extend to the first non-zero digit (10.12%, 9.05%, 0.004%)
    const pct = p => {
        const v = p * 100; if (!(v > 0)) return "0.00%";
        const d = v >= 1 ? 2 : Math.max(2, -parseInt(v.toExponential().split("e")[1]));
        return v.toFixed(d) + "%";
    };
    const poly = (a, w, h, m) => { m = m || Math.max(...a) || 1; return Array.from(a, (v, k) => (k / (Y - 1) * w).toFixed(1) + "," + (h - v / m * h).toFixed(1)).join(" ") };
    const label = i => names[i] + "-" + (male[i] ? "M" : "F");
    const go = i => location.hash = "#" + label(i);
    function route() {
        const h = decodeURIComponent(location.hash.slice(1)), k = h.lastIndexOf("-");
        const isGame = h == "~game", wasGame = document.body.classList.contains("game");
        document.body.classList.toggle("game", isGame);
        const g = $("glink");
        g.textContent = isGame ? "Search" : "The Name Game";
        g.href = isGame ? "#" : "#~game";
        if (isGame) { q.value = ""; document.title = "The Name Game"; return; }
        if (wasGame) q.focus();
        const e = find.get(h.slice(0, k).toLowerCase()), i = e && e[h[k + 1] == "M" ? 1 : 0];
        if (!(i >= 0)) return blank();
        if (q.value.trim().toLowerCase() != low[i]) q.value = names[i];
        draw(i);
    }
    const blank = () => { $("out").innerHTML = ""; document.title = "Name Stats" };

    function draw(i) {
        const e = find.get(low[i]), W = 800, H = 180, sx = male[i];
        // this name's births per state per year
        const sy = new Float64Array(S * Y);
        for (let k = so[i]; k < so[i + 1]; k++) sy[es[k] * Y + ey[k]] = ec[k];
        const tg = (k, l) => `<a class="${sx == k ? "on" : ""}${e[k] < 0 ? " off" : ""}"${e[k] >= 0 ? ` onclick="go(${e[k]})"` : ""}>${l}</a>`;
        const sxl = `<span class="sx">${tg(0, "F")}${tg(1, "M")}</span>`;
        // map
        const b = base[sx], sh = Array.from(codes, (c, s) => st[i * S + s] / (b[s] || 1)), mx = Math.max(...sh) || 1; let ts = 0; for (let s = 0; s < S; s++)ts += st[i * S + s]; const ok = ts >= 100;
        const tiles = codes.map((c, s) => {
            const [x, y] = POS[c], t = Math.pow(sh[s] / mx, .6);
            return `<g data-s="${s}" transform="translate(${x * 40},${y * 40})"><rect width="36" height="36" rx="4" fill="${ok ? "var(--ac)" : "var(--ln)"}" fill-opacity="${ok ? (.06 + .94 * t).toFixed(2) : 1}" stroke="none"/><text x="18" y="22" font-size="11" text-anchor="middle" fill="${t > .6 ? "#fff" : "var(--mut)"}">${c}</text></g>`
        }).join("");
        $("out").className = "";
        $("out").innerHTML = `
  <div class="hd">${sxl}<span class="mut" id="hs"></span></div>
  <div class="mut" id="rd">&nbsp;</div>
  <svg id="ch" viewBox="0 0 ${W} ${H + 16}">
    <rect id="gr" x="0" y="0" width="0" height="${H}" fill="var(--mut)" fill-opacity=".15"/>
    <polygon id="ar" points="" fill="var(--ac)" fill-opacity=".12"/>
    <polyline id="ln" points="" fill="none" stroke="var(--ac)" stroke-width="2"/>
    <line id="sc" y1="0" y2="${H}" stroke="var(--mut)" opacity="0"/>
    <circle id="pk" cx="0" cy="0" r="4" fill="var(--ac)"/>
    <text y="${H + 14}" font-size="11" fill="var(--mut)">${Y0}</text>
    <text x="${W}" y="${H + 14}" font-size="11" fill="var(--mut)" text-anchor="end">${Y0 + Y - 1}</text>
  </svg>
  <div class="row cols"><div><svg id="mp" viewBox="0 0 436 316">${tiles}${ok ? "" : '<text x="218" y="162" font-size="16" text-anchor="middle" fill="var(--fg)" stroke="var(--bg)" stroke-width="6" style="paint-order:stroke">Insufficient Data</text>'}</svg><div id="tip" class="mut"></div></div>
  <div></div></div>`;
        const ch = $("ch"), rd = $("rd"), sc = $("sc"), mp = $("mp"), tip = $("tip");
        let hov = -1, cur = -2, start = 0, a, r, den;   // hovered state, state whose graph is shown (-1 = national)
        // graph for one scope: -1 = national, otherwise a state index
        const show = s => {
            cur = s;
            r = s < 0 ? raw(i) : sy.subarray(s * Y, (s + 1) * Y);
            den = k => s < 0 ? yt[sx * Y + k] : sty[(s * 2 + sx) * Y + k];
            a = Float64Array.from(r, (v, k) => v / (den(k) || 1));
            const m = Math.max(...a), pk = a.indexOf(m), fi = a.findIndex(v => v > 0); let la = Y - 1; while (la > 0 && !a[la]) la--;
            // years before a state's data begins are greyed out and not drawn
            let c0 = 0; while (c0 < Y - 1 && !den(c0)) c0++;
            const xs = c0 / (Y - 1) * W, poly_ = Array.from(a.subarray(c0), (v, j) => ((c0 + j) / (Y - 1) * W).toFixed(1) + "," + (H - v / (m || 1) * H).toFixed(1)).join(" ");
            $("gr").setAttribute("width", xs);
            $("ar").setAttribute("points", `${xs},${H} ${poly_} ${W},${H}`);
            $("ln").setAttribute("points", poly_);
            start = c0;
            $("pk").setAttribute("cx", pk / (Y - 1) * W); $("pk").setAttribute("cy", m ? 0 : H);
            const tot_ = s < 0 ? tot[i] : st[i * S + s], where = s < 0 ? "National" : codes[s];
            $("hs").textContent = (fi < 0 ? "No births" : fmt(tot_) + " births from " + (Y0 + fi) + "–" + (Y0 + la)) + " · " + where;
            rd.innerHTML = "&nbsp;"; sc.setAttribute("opacity", 0);
        };
        const mark = () => mp.querySelectorAll("g").forEach(g => {
            const s = +g.dataset.s, rc = g.firstChild;
            rc.setAttribute("stroke", ok && (s == pin || s == hov) ? "var(--fg)" : "none");
            rc.setAttribute("stroke-width", s == pin ? 3 : 2);
            rc.setAttribute("stroke-dasharray", s == pin ? "" : "4 3");
        });
        const refresh = () => {
            const s = !ok ? -1 : hov >= 0 ? hov : pin;
            if (s !== cur) show(s);
            mark();
            const t = s => codes[s] + " · " + pct(sh[s]) + " (" + fmt(st[i * S + s]) + " / " + fmt(b[s]) + " " + (sx ? "boys" : "girls") + ")";
            tip.textContent = !ok ? "" : hov >= 0 ? t(hov) + (hov == pin ? " (selected)" : "")
                : pin >= 0 ? t(pin) + " (selected)" : "Click on a state to lock it.";
        };
        ch.onmousemove = ev => {
            const rc = ch.getBoundingClientRect(), k = Math.max(0, Math.min(Y - 1, Math.round((ev.clientX - rc.left) / rc.width * (Y - 1))));
            sc.setAttribute("x1", k / (Y - 1) * W); sc.setAttribute("x2", k / (Y - 1) * W); sc.setAttribute("opacity", 1);
            rd.textContent = k < start ? (Y0 + k) + " · no state data" : (Y0 + k) + " · " + pct(a[k]) + " (" + fmt(r[k]) + " / " + fmt(den(k)) + " " + (sx ? "boys" : "girls") + ")"
        };
        ch.onmouseleave = () => { sc.setAttribute("opacity", 0); rd.innerHTML = "&nbsp;" };
        mp.onmouseover = ev => { const g = ev.target.closest("g"); if (ok && g && +g.dataset.s !== hov) { hov = +g.dataset.s; refresh(); } };
        mp.onmouseleave = () => { hov = -1; refresh(); };
        mp.onclick = ev => { const g = ev.target.closest("g"); if (!ok || !g) return; const s = +g.dataset.s; pin = pin == s ? -1 : s; refresh(); };
        refresh();
        document.title = names[i];
    }

    // ---------------------------------------------------------------- the name game
    let G;
    const nameLink = (i, t) => `<a class="nl" href="#${encodeURIComponent(label(i))}">${esc(t)}</a>`;
    // a guess that is a known name links to its page (prefer the side it's listed under)
    const guessLink = (g, k) => { const f = find.get(g); if (!f) return esc(g); const i = f[k] >= 0 ? f[k] : f[1 - k]; return nameLink(i, g); };
    const esc = t => t.replace(/[&<>"]/g, c => "&#" + c.charCodeAt(0) + ";");
    // a side (0 = girls, 1 = boys) is finished after 3 strikes or once all 20 names are found
    const done = k => G.bad[k].length >= 3 || G.got[k].size >= 20;
    // Top 20 for a place + year, read from names.bin. s = -1 means national, y = 0 means all time.
    const topAt = (s, sex, y) => (((s + 1) * 2 + sex) * (Y + 1) + (y ? y - Y0 + 1 : 0)) * T;
    function top20(s, y, sex) {
        const o = topAt(s, sex, y), out = [];
        for (let k = 0; k < T && topL[o + k] !== NONE; k++) out.push(topL[o + k]);
        return out;
    }
    // years that have lists for a place (states start later than the national data)
    const yearOpts = s => Array.from({ length: Y }, (_, k) => Y0 + Y - 1 - k).filter(y => topL[topAt(s, 0, y)] !== NONE).map(y => `<option>${y}</option>`).join("");
    function showGame() {
        $("game").innerHTML = `<div class="hd"><h1>The Name Game</h1></div>
  <div style="margin:14px 0"><select id="gs"><option value="-1">National</option>${codes.map((c, k) => `<option value="${k}">${c}</option>`).join("")}</select>
  <select id="gy"><option value="0">All Time</option>${yearOpts(-1)}</select> <button class="btn" id="gb">Start</button></div><div id="gm"></div>`;
        $("gs").onchange = () => {  // only offer years that exist for the chosen place
            const y = $("gy").value; $("gy").innerHTML = `<option value="0">All Time</option>${yearOpts(+$("gs").value)}`;
            if ([...$("gy").options].some(o => o.value == y)) $("gy").value = y;
        };
        $("gb").onclick = startGame;
    }
    function startGame() {
        const s = +$("gs").value, y = +$("gy").value;
        G = { lists: [top20(s, y, 0), top20(s, y, 1)], got: [new Set(), new Set()], bad: [[], []], pts: 0 };
        $("gm").innerHTML = `<div class="mut" id="gst"></div><input id="gi" placeholder="Guess a name" autocomplete="off" spellcheck="false">
  <div class="gg" id="gl"></div>`;
        const gi = $("gi"); gi.focus();
        gi.onkeydown = ev => {
            if (ev.key !== "Enter") return;
            const g = gi.value.trim().toLowerCase(); gi.value = "";
            if (!g || G.bad[0].includes(g) || G.bad[1].includes(g)) return;   // repeat strikes don't count
            let hit = false;
            // check both lists, so a name in the top 20 of both sexes is marked on both
            G.lists.forEach((l, k) => {
                if (done(k)) return;
                l.forEach((j, r) => {
                    if (low[j] !== g) return;
                    hit = true;
                    if (!G.got[k].has(j)) { G.got[k].add(j); G.pts++; }
                });
            });
            if (!hit) {   // strike goes to the sex that uses the name more (unknown names: the side with fewer strikes)
                const f = find.get(g) || [-1, -1], a = f[0] < 0 ? 0 : tot[f[0]], b = f[1] < 0 ? 0 : tot[f[1]];
                let k = a != b ? (a > b ? 0 : 1) : G.bad[0].length <= G.bad[1].length ? 0 : 1;
                if (done(k)) k = 1 - k;   // that side is finished: the guess counts against the other side
                if (!done(k)) G.bad[k].push(g);
            }
            renderGame();
        };
        renderGame();
    }
    function renderGame() {
        const side = (t, k) => {
            const item = (j, r) => {
                const got = G.got[k].has(j), show = got || done(k);
                const hint = names[j][0] + " _".repeat(names[j].length - 1);
                return `<div class="n g"><span class="rk">${r + 1}</span><span style="${show && !got ? "color:var(--mut)" : ""}">${show ? nameLink(j, names[j]) : hint}</span></div>`;
            }, ids = G.lists[k];
            return `<div><h2>${t}</h2><div class="mut st">Strikes (${G.bad[k].length}/3): ${G.bad[k].map(x => guessLink(x, k)).join(", ")}</div><div class="g2">` +
                `<div>${ids.slice(0, 10).map((j, r) => item(j, r)).join("")}</div><div>${ids.slice(10).map((j, r) => item(j, r + 10)).join("")}</div></div></div>`;
        };
        $("gst").textContent = "Score " + G.pts + "/40";
        $("gl").innerHTML = side("GIRLS", 0) + side("BOYS", 1);
        if (!done(0) || !done(1)) return;
        $("gi").style.display = "none";
    }

    q.oninput = () => {
        document.body.classList.remove("game");
        const e = find.get(q.value.trim().toLowerCase());
        if (!e) return blank();
        const i = e[0] < 0 ? e[1] : e[1] < 0 ? e[0] : tot[e[0]] >= tot[e[1]] ? e[0] : e[1];
        history.replaceState(null, "", "#" + label(i));
        draw(i);
    };
    addEventListener("hashchange", route);
    init().catch(e => $("out").textContent = e);
</script>
